name: Flutter Android

on:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test business rules and encrypted ledger
        run: flutter test --no-pub --reporter expanded

      - name: Build installable test APK
        run: flutter build apk --debug --no-pub

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: ezbookkeeping-android-debug-${{ github.sha }}
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
