name: ezbookkeeping
description: Native Android client for ezBookkeeping, with durable offline accounting.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.13.2 <4.0.0'
  flutter: '>=3.47.2'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.9
  flutter_riverpod: 3.4.3
  go_router: 18.0.1
  dio: 5.11.1
  drift: 2.35.0
  sqlite3: 3.6.0
  flutter_secure_storage: 11.1.1
  path_provider: 2.1.6
  fl_chart: 1.2.0
  intl: 0.20.3
  uuid: 4.6.0
  crypto: 3.0.7
  cryptography: 2.9.0
  local_auth: 3.0.2
  image_picker: 1.2.3
  image: 4.10.1
  geolocator: 14.0.3
  url_launcher: 6.3.2
  file_picker: 13.0.0
  share_plus: 13.3.0
  webview_flutter: 4.14.1
  app_links: 7.2.1
  connectivity_plus: 7.3.1
  flutter_timezone: 5.1.0
  # 9.6.1 refers to an unpublished code_assets Architecture.arm64e constant.
  objective_c: 9.6.0
  qr_flutter: 4.1.0
  timezone: 0.11.1
  ua_parser: 1.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/locales/
    - assets/native_locales/
    - assets/logo.png
    - assets/reference/
  fonts:
    - family: LineAwesomeSolid
      fonts:
        - asset: assets/fonts/la-solid-900.ttf
    - family: LineAwesomeRegular
      fonts:
        - asset: assets/fonts/la-regular-400.ttf
    - family: LineAwesomeBrands
      fonts:
        - asset: assets/fonts/la-brands-400.ttf
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
